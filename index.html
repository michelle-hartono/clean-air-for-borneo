<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>from taipei to palangka raya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F0E8;
    --ink: #2B2722;
    --soft: #5E574D;
    --muted: #6B645A;
    --line: #D8CFBF;
    --clay: #A8462F;
    --leaf: #6E8F5A;
    --card: #FBF9F4;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 22px 64px; }
  .hero { display: block; width: 100%; height: auto; border-radius: 4px; }
  h1 { font-size: clamp(30px, 7vw, 42px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; margin: 28px 0 10px; }
  .lede { margin: 0; font-size: 17px; color: var(--soft); max-width: 34em; }
  .raised { margin: 28px 0 8px; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .raised .big { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; color: var(--clay); margin: 0; }
  .raised .small { margin: 4px 0 0; color: var(--soft); font-size: 15px; }
  h2 { font-size: 20px; font-weight: 600; margin: 40px 0 4px; }
  .place { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .place a { color: var(--clay); }
  ol.steps { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.steps::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .step { position: relative; padding: 0 0 26px 36px; }
  .step:last-child { padding-bottom: 0; }
  .dot { position: absolute; left: 0; top: 3px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); }
  .step.done .dot { background: var(--leaf); border-color: var(--leaf); }
  .step.done .dot::after { content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .step.current .dot { border-color: var(--clay); }
  .label { margin: 0; font-weight: 600; font-size: 17px; }
  .step:not(.done) .label { color: var(--muted); font-weight: 500; }
  .date { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .note { margin: 6px 0 0; font-size: 16px; color: var(--soft); }
  .photo { display: block; width: 100%; max-width: 420px; height: auto; margin-top: 12px; border-radius: 4px; border: 6px solid #fff; box-shadow: 0 2px 10px rgba(60, 50, 30, 0.15); }
  .moments { margin-top: 44px; }
  .moment { margin-top: 18px; }
  .moment p { margin: 0; color: var(--soft); }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  footer p { margin: 0 0 6px; }
  .error { color: var(--clay); }
  a:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="hero" src="assets/hero.jpg" alt="A child's watercolour drawing of a little house with an air purifier in the window blowing clean air, with children cheering outside">
  <h1>from taipei to palangka raya</h1>
  <p class="lede">For my 25th, friends chipped in for air purifiers for haze shelters in Central Kalimantan, Borneo. This page follows them all the way there.</p>
  <div id="raised" class="raised" aria-live="polite"></div>
  <div id="shelters"></div>
  <div id="moments" class="moments"></div>
  <footer>
    <p>Photos: Ranu Welum Foundation and Rumah Aman Asap.</p>
    <p id="updated"></p>
  </footer>
</main>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const fmtTwd = (n) => 'NT$' + Number(n).toLocaleString('en-US');

  function renderRaised(r) {
    const el = document.getElementById('raised');
    if (r && r.closed) {
      const count = r.purifiers === 1 ? '1 air purifier' : `${r.purifiers} air purifiers`;
      el.innerHTML = `<p class="big">${esc(fmtTwd(r.twd))} raised</p><p class="small">That's ${esc(count)}. Donations closed on ${esc(fmtDate(r.date))}.</p>`;
    } else {
      el.innerHTML = `<p class="big">Donations are open</p><p class="small">${esc((r && r.note) || 'Donations close on 14 November.')}</p>`;
    }
  }

  function renderShelter(s) {
    const firstOpen = s.steps.findIndex((st) => !st.done);
    const steps = s.steps.map((st, i) => {
      const cls = st.done ? 'done' : (i === firstOpen ? 'current' : '');
      const photo = st.photo ? `<img class="photo" src="${esc(st.photo)}" alt="${esc(st.alt || st.label)}" loading="lazy">` : '';
      return `<li class="step ${cls}"><span class="dot" aria-hidden="true"></span>
        <p class="label">${esc(st.label)}${st.done ? '' : '<span class="visually-hidden"> (not yet)</span>'}</p>
        ${st.date ? `<p class="date">${esc(fmtDate(st.date))}</p>` : ''}
        ${st.note ? `<p class="note">${esc(st.note)}</p>` : ''}${photo}</li>`;
    }).join('');
    const link = s.link ? ` <a href="${esc(s.link)}" target="_blank" rel="noopener">See the shelter</a>` : '';
    return `<section><h2>${esc(s.name)}</h2><p class="place">${esc(s.place)}.${link}</p><ol class="steps">${steps}</ol></section>`;
  }

  function renderMoments(list) {
    if (!list || !list.length) return '';
    return '<h2>Along the way</h2>' + list.map((m) => `<div class="moment">${m.date ? `<p class="date">${esc(fmtDate(m.date))}</p>` : ''}<p>${esc(m.text)}</p>${m.photo ? `<img class="photo" src="${esc(m.photo)}" alt="${esc(m.alt || m.text)}" loading="lazy">` : ''}</div>`).join('');
  }

  fetch('status.json', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      renderRaised(data.raised);
      document.getElementById('shelters').innerHTML = data.shelters.map(renderShelter).join('');
      document.getElementById('moments').innerHTML = renderMoments(data.moments);
      document.getElementById('updated').textContent = data.updated ? 'Last updated ' + fmtDate(data.updated) + '.' : '';
    })
    .catch(() => {
      document.getElementById('raised').innerHTML = '<p class="error">The tracker couldn\'t load just now. Refresh the page to try again.</p>';
    });
</script>
<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</body>
</html>
